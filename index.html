<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ormidon Labs</title>
    <meta
      name="description"
      content="Ormidon Labs has arrived. A native AI venture studio. The areas we focus on are built on AI."
    />
    <meta name="theme-color" content="#fc3c00" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body id="top">
    <header class="top">
      <a class="logo" href="#top">
        <span class="mark" aria-hidden="true"></span>
        Ormidon Labs
      </a>
    </header>

    <main>
      <p class="where">Bay Area · Los Angeles</p>
      <h1>
        <span class="l1">We build what</span>
        <span class="l2">AI makes</span>
        <span class="l3">possible.</span>
      </h1>
      <p class="intro">
        Ormidon Labs has arrived. A native AI venture studio. The areas we focus
        on are built on AI.
      </p>
      <form id="signup" class="know">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          maxlength="254"
          spellcheck="false"
          placeholder="Email address"
        />
        <button class="btn solid" id="join" type="submit">Stay in the know</button>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <footer>
      <span>© 2026 Ormidon Labs Inc.</span>
      <span>Bay Area · Los Angeles</span>
    </footer>

    <script>
      (function () {
        var form = document.getElementById("signup");
        var input = document.getElementById("email");
        var status = document.getElementById("status");
        var thanks =
          "Thank you, we got your email. We'll put you on the mailing list, or we'll be in touch.";
        if (!form || !input || !status) return;
        function valid(email) {
          return (
            email.length <= 254 &&
            /^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*\.[A-Za-z]{2,63}$/.test(
              email
            )
          );
        }
        function attempt() {
          var email = input.value.trim();
          input.value = email;
          if (!valid(email)) {
            input.setAttribute("aria-invalid", "true");
            status.textContent = email
              ? "Enter a valid email address."
              : "Enter an email address.";
            input.focus();
            return;
          }
          input.removeAttribute("aria-invalid");
          status.textContent = thanks;
          status.scrollIntoView({ block: "nearest" });
        }
        form.addEventListener("submit", function (event) {
          event.preventDefault();
          attempt();
        });
      })();
    </script>
  </body>
</html>
