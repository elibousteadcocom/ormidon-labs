<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ormidon Labs</title>
    <meta
      name="description"
      content="Ormidon Labs has arrived. A native AI venture studio. The areas we focus on are built on AI."
    />
    <meta name="theme-color" content="#fc3c00" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body id="top">
    <header class="top">
      <a class="logo" href="#top">
        <span class="mark" aria-hidden="true"></span>
        Ormidon Labs
      </a>
      <a class="btn" href="#know">Stay in the know</a>
    </header>

    <main>
      <p class="where">Bay Area · Los Angeles</p>
      <h1>
        <span class="l1">We build what</span>
        <span class="l2">AI makes</span>
        <span class="l3">possible.</span>
      </h1>
      <p class="intro">
        Ormidon Labs has arrived. A native AI venture studio. The areas we focus
        on are built on AI.
      </p>
      <form id="signup" class="know">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          inputmode="email"
          maxlength="254"
          spellcheck="false"
          placeholder="Email address"
        />
        <a
          id="mail"
          class="btn solid"
          href="mailto:operations@ormidon.com?subject=Stay%20in%20the%20know"
          >Stay in the know</a
        >
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </form>
    </main>

    <footer>
      <span>© 2026 Ormidon Labs Inc.</span>
      <span>Bay Area · Los Angeles</span>
    </footer>

    <script>
      (function () {
        var form = document.getElementById("signup");
        var input = document.getElementById("email");
        var link = document.getElementById("mail");
        var status = document.getElementById("status");
        if (!form || !input || !link || !status) return;
        var subject = "Stay in the know";
        function mailHref() {
          var email = input.value.trim();
          var href =
            "mailto:operations@ormidon.com?subject=" +
            encodeURIComponent(subject);
          if (email) {
            href += "&body=" + encodeURIComponent("Email address: " + email);
          }
          return href;
        }
        function valid(email) {
          return (
            email.length <= 254 &&
            /^[A-Za-z0-9.!#$%&'*+/=?^_`{|}~-]+@[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)+$/.test(
              email
            )
          );
        }
        link.addEventListener("click", function (event) {
          var email = input.value.trim();
          input.value = email;
          if (email && !valid(email)) {
            event.preventDefault();
            input.setAttribute("aria-invalid", "true");
            status.textContent = "Enter a valid email address.";
            return;
          }
          input.removeAttribute("aria-invalid");
          status.textContent = "";
          link.href = mailHref();
        });
        form.addEventListener("submit", function (event) {
          event.preventDefault();
          link.click();
        });
      })();
    </script>
  </body>
</html>
