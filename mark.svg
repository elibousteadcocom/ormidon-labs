<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="45%" stop-color="#FF9E1B"/>
      <stop offset="100%" stop-color="#E04F00"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C77DFF"/>
      <stop offset="50%" stop-color="#7B2CBF"/>
      <stop offset="100%" stop-color="#240046"/>
    </linearGradient>
    <linearGradient id="sunsetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3C096C"/>
      <stop offset="50%" stop-color="#FF5E1A"/>
      <stop offset="100%" stop-color="#FFB703"/>
