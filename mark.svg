      <path d="M -110,-155 C 0,-320 240,-270 305,-65 C 335,45 275,180 180,210 C 235,100 205,-55 95,-115 C 15,-160 -65,-135 -110,-155 Z" fill="url(#violetGrad)" opacity="0.88"/>
    </g>
    <g transform="rotate(60)">
      <path d="M -140,-180 C -20,-380 280,-320 350,-80 C 390,60 310,220 180,240 C 260,120 240,-60 110,-130 C 20,-180 -80,-150 -140,-180 Z" fill="url(#sunsetGrad)"/>
    </g>
    <g transform="rotate(120)">
      <path d="M -140,-180 C -20,-380 280,-320 350,-80 C 390,60 310,220 180,240 C 260,120 240,-60 110,-130 C 20,-180 -80,-150 -140,-180 Z" fill="url(#violetGrad)"/>
      <path d="M -125,-165 C -10,-340 250,-290 320,-70 C 350,40 290,185 180,215 C 240,105 215,-55 100,-120 C 15,-165 -70,-140 -125,-165 Z" fill="url(#amberGrad)" opacity="0.75"/>
    </g>
    <g transform="rotate(180)">
      <path d="M -140,-180 C -20,-380 280,-320 350,-80 C 390,60 310,220 180,240 C 260,120 240,-60 110,-130 C 20,-180 -80,-150 -140,-180 Z" fill="url(#amberGrad)"/>
    </g>
    <g transform="rotate(240)">
      <path d="M -140,-180 C -20,-380 280,-320 350,-80 C 390,60 310,220 180,240 C 260,120 240,-60 110,-130 C 20,-180 -80,-150 -140,-180 Z" fill="url(#violetGrad)"/>
    </g>
    <g transform="rotate(300)">
      <path d="M -140,-180 C -20,-380 280,-320 350,-80 C 390,60 310,220 180,240 C 260,120 240,-60 110,-130 C 20,-180 -80,-150 -140,-180 Z" fill="url(#sunsetGrad)"/>
    </g>
  </g>
